# Release: build both images on both architectures, smoke each offline, then
# push to ghcr with provenance attestations, and stage both npm packages for a
# maintainer's approval.
#
#   plan -> build (image x arch) -> publish (image)
#        -> manifest -> attach-manifest (a non-scratch version only)
#        -> npm (a real tag push only)
#
# Triggers: a vX.Y.Z tag pushed by hand (the floating v1 does not match, so
# moving it starts nothing), or workflow_dispatch. Nothing here runs
# on a branch push or a pull request (ci.yml owns those). Two jobs log in to
# a registry, each to one: `publish` to ghcr (the GITHUB_TOKEN), `npm` to
# npmjs (trusted publishing: the job's OIDC token, no secret). No other job
# logs in or pushes.
#
# The images (docker/Dockerfile and docker/memory/Dockerfile):
#   ghcr.io/quickchatai/quickreview:<version>          the release image
#   ghcr.io/quickchatai/quickreview-memory:<version>   the memory sidecar
# <version> is the tag without its leading v, and equals package.json's
# version (the image's own `version --json`). Each is one multi-arch index
# over linux/amd64 and linux/arm64. Each architecture is also pushed under
# <version>-amd64 and <version>-arm64 so the index can be assembled from
# digests; those are plumbing, not tags to pin. No image has a `latest` tag, and the floating
# v1 major tag of the Action is moved by hand, not by this workflow.
#
# The npm packages: @quickchatai/pi-quickreview (packages/pi-plugin, the core
# and the pi plugin) and @quickchatai/quickreview (the root, the qcr app),
# both at <version>. CI never publishes either directly: it packs both
# tarballs, keeps them as the workflow artifact npm-tarballs-<version>, and
# stages each with `npm stage publish`, the plugin first because the root pins
# it at its exact version. Nothing reaches the public registry until a
# maintainer approves each staged version with 2FA (`npm stage approve
# <stage-id>`, or Approve on npmjs.com), the plugin before the app. On npm a
# release goes under the dist-tag `latest` (`qcr update` installs that tag:
# src/npmverbs.ts); a prerelease (X.Y.Z-rc.N) goes under `next` and never
# moves `latest`. A version already on the registry is not staged again, so a
# re-run after a failed later step is safe. A scratch version and a manual
# dispatch never stage to npm.
#
# Runners: Blacksmith's (blacksmith-*, the org's Blacksmith app), with the image
# builds on Blacksmith's Docker builder and its layer cache. The repository
# variable QCR_RUNNERS=github puts every job on GitHub's own runners instead
# (ubuntu-latest, ubuntu-24.04-arm), with buildx and the gha cache: the route for
# a repo without the app, a fork's copy included. The `npm` job always
# runs on GitHub's ubuntu-latest: npm accepts trusted publishing and
# provenance only from GitHub-hosted runners.
#
# ARM runners: native by default, so the arm64 smoke runs on real arm64
# and the memory image's llama-cpp-python compiles natively. The repo variable
# RELEASE_ARM64_RUNNER, when set, picks the label over both defaults. Set it to
# `qemu` and the arm64 legs run on ubuntu-latest under QEMU instead: the
# fallback, slow, and the memory image can take hours under emulation.
#
# What the owner sets up once (this file creates none of it):
#   - optional repo variables QCR_RUNNERS and RELEASE_ARM64_RUNNER (above).
#   - packages: the repo needs write access to both ghcr packages, which are
#     public, so anyone pulls them with no login. The provenance attestations
#     run on a public repo, as npm's provenance does; a private copy of this
#     workflow publishes without them, and the deploy manifest's digests still
#     pin what the VM pulls.
#   - npmjs: the `quickchatai` org, which owns both packages;
#   - environment `npm-publish`, whose deployment ref policy admits only tags
#     matching v*.*.*, so a run from master or a branch never runs the `npm`
#     job's steps; it holds no secret;
#   - a trusted publisher on each npm package (.github/npm-trust.sh sets
#     both): repository quickchatai/quickreview, workflow release.yml,
#     environment npm-publish, allowed to stage-publish only. npm takes the
#     `npm` job's OIDC token (its id-token: write) from that workflow in that
#     environment and from nothing else, and on a public repo attaches
#     provenance. The publisher can stage and never publish, so each release
#     is staged by CI and approved by a maintainer with 2FA. No npm token
#     exists anywhere for this workflow.
#
# No job reaches a model: the smoke runs offline, and no release step costs
# money or holds a model login.
#
# Scratch runs: a version with `-scratch` in it (v0.0.0-scratch.1) may run from
# any ref (workflow_dispatch). A scratch version never moves any tag but its
# own. A real version cannot be published from anything but its own tag.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (X.Y.Z, or X.Y.Z-scratch.N for a scratch run)"
        required: true
        type: string
      publish:
        description: "Push to ghcr after the gates (a tag push always does)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ${{ vars.QCR_RUNNERS == 'github' && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2404' }}
    outputs:
      version: ${{ steps.plan.outputs.version }}
      scratch: ${{ steps.plan.outputs.scratch }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: resolve and check the version
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          die() { echo "::error::release plan: $*"; exit 1; }
          if [ "$EVENT" = push ]; then
            version="${REF_NAME#v}"
            publish=true
          else
            version="$IN_VERSION"
            publish="$IN_PUBLISH"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
            die "'$version' is not X.Y.Z or X.Y.Z-suffix"
          scratch=false
          [[ "$version" == *-scratch* ]] && scratch=true
          if [ "$scratch" != true ]; then
            [ "$REF_TYPE" = tag ] && [ "$REF_NAME" = "v$version" ] ||
              die "a real release runs from its own tag v$version (this is $REF_TYPE $REF_NAME)"
            pkg="$(node -p 'require("./package.json").version')"
            [ "$pkg" = "$version" ] || die "package.json is $pkg, the release is $version"
          fi
          {
            echo "version=$version"
            echo "scratch=$scratch"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
          printf '### Release plan\n\n- version: %s (scratch: %s)\n- push to ghcr: %s\n' \
            "$version" "$scratch" "$publish" >>"$GITHUB_STEP_SUMMARY"

  # One leg per image and architecture. Builds with plain buildx (no push),
  # smokes offline, and hands the tested image to the later jobs as a tarball,
  # so what is pushed is byte-for-byte what was smoked.
  build:
    needs: plan
    name: build ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image: [release, memory]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ${{ vars.QCR_RUNNERS == 'github' && 'ubuntu-latest' || 'blacksmith-8vcpu-ubuntu-2404' }}
            qemu: "false"
          - arch: arm64
            runner: ${{ vars.RELEASE_ARM64_RUNNER == 'qemu' && 'ubuntu-latest' || vars.RELEASE_ARM64_RUNNER || (vars.QCR_RUNNERS == 'github' && 'ubuntu-24.04-arm' || 'blacksmith-8vcpu-ubuntu-2404-arm') }}
            qemu: ${{ vars.RELEASE_ARM64_RUNNER == 'qemu' && 'true' || 'false' }}
          - image: release
            file: docker/Dockerfile
          - image: memory
            file: docker/memory/Dockerfile
    env:
      LOCAL_TAG: qcr-${{ matrix.image }}:${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.qemu == 'true'
        with:
          platforms: arm64
      # On a Blacksmith runner: Blacksmith's builder, whose layer cache lives on
      # the runner fleet's own disks (one cache per image and arch). Anywhere
      # else (QCR_RUNNERS=github, the QEMU leg): buildx with the gha cache.
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        if: startsWith(matrix.runner, 'blacksmith-')
        with:
          cache-key: ${{ matrix.image }}-${{ matrix.arch }}
      - name: build (Blacksmith)
        if: startsWith(matrix.runner, 'blacksmith-')
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: ${{ env.LOCAL_TAG }}
          build-args: ${{ matrix.image == 'release' && format('BUILD_SHA={0}', github.sha) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ !startsWith(matrix.runner, 'blacksmith-') }}
      - name: build
        if: ${{ !startsWith(matrix.runner, 'blacksmith-') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: ${{ env.LOCAL_TAG }}
          build-args: ${{ matrix.image == 'release' && format('BUILD_SHA={0}', github.sha) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
      - name: the image is the architecture it claims
        run: |
          got="$(docker image inspect --format '{{.Architecture}}' "$LOCAL_TAG")"
          [ "$got" = "${{ matrix.arch }}" ] || { echo "::error::$LOCAL_TAG is $got, not ${{ matrix.arch }}"; exit 1; }
      - name: offline smoke (release image)
        if: matrix.image == 'release'
        run: |
          .github/ci/image-smoke.sh "$LOCAL_TAG"
          # The image's version is package.json's, and the image carries no claude (rule 5).
          want="$(node -p 'require("./package.json").version')"
          got="$(docker run --rm --init --cap-drop ALL --security-opt no-new-privileges "$LOCAL_TAG" version --json | jq -r .image.version)"
          [ "$got" = "$want" ] || { echo "::error::image version $got, package.json $want"; exit 1; }
          if docker run --rm --entrypoint sh "$LOCAL_TAG" -c 'command -v claude' >/dev/null 2>&1; then
            echo "::error::the release image carries claude"
            exit 1
          fi
      - name: offline smoke (memory sidecar)
        if: matrix.image == 'memory'
        run: |
          set -euo pipefail
          box() { docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --entrypoint "$@"; }
          want_ov="$(sed -n 's/^ARG OPENVIKING_VERSION=//p' docker/memory/Dockerfile)"
          want_llama="$(sed -n 's/^ARG LLAMA_CPP_PYTHON_VERSION=//p' docker/memory/Dockerfile)"
          want_sha="$(sed -n 's/^ARG LOCAL_EMBEDDER_SHA256=//p' docker/memory/Dockerfile)"
          [ -n "$want_ov" ] && [ -n "$want_llama" ] && [ -n "$want_sha" ] || { echo "::error::a pin is missing from docker/memory/Dockerfile"; exit 1; }
          py=/opt/openviking/venv/bin/python
          got="$(box "$py" "$LOCAL_TAG" -c 'import importlib.metadata as m, llama_cpp; print(m.version("openviking"), m.version("llama-cpp-python"))')"
          [ "$got" = "$want_ov $want_llama" ] || { echo "::error::sidecar pins are '$got', want '$want_ov $want_llama'"; exit 1; }
          sum="$(box sha256sum "$LOCAL_TAG" /opt/openviking/models/bge-small-en-v1.5-f16.gguf | cut -d' ' -f1)"
          [ "$sum" = "$want_sha" ] || { echo "::error::the embedder GGUF is $sum, want $want_sha"; exit 1; }
          box test "$LOCAL_TAG" -x /opt/openviking/venv/bin/openviking-server
          printf '### Memory sidecar smoke (%s)\n\n- openviking %s, llama-cpp-python %s, GGUF sha256 verified\n' \
            "${{ matrix.arch }}" "$want_ov" "$want_llama" >>"$GITHUB_STEP_SUMMARY"
      - name: save the tested image
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          docker save "$LOCAL_TAG" | gzip -1 >"$RUNNER_TEMP/out/image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/image.tar.gz
          retention-days: 1
          compression-level: 0

  # The only job with a registry login. Runs when every build leg and its
  # smoke passed.
  publish:
    needs: [plan, build]
    if: >-
      ${{ !cancelled()
      && needs.plan.outputs.publish == 'true'
      && needs.build.result == 'success' }}
    name: publish ${{ matrix.image }}
    runs-on: ${{ vars.QCR_RUNNERS == 'github' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [release, memory]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REPO: ${{ matrix.image == 'release' && 'ghcr.io/quickchatai/quickreview' || 'ghcr.io/quickchatai/quickreview-memory' }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-${{ matrix.image }}-*
          path: ${{ runner.temp }}/in
      - name: push each architecture, then the index
        id: push
        run: |
          set -euo pipefail
          digest_of() {
            docker image inspect "$1" --format '{{json .RepoDigests}}' |
              jq -r --arg r "$REPO@" 'map(select(startswith($r))) | .[0] | sub("^.*@"; "")'
          }
          for arch in amd64 arm64; do
            gunzip -c "$RUNNER_TEMP/in/image-${{ matrix.image }}-$arch/image.tar.gz" | docker load
            docker tag "qcr-${{ matrix.image }}:$arch" "$REPO:$VERSION-$arch"
            docker push "$REPO:$VERSION-$arch"
            d="$(digest_of "$REPO:$VERSION-$arch")"
            [ -n "$d" ] && [ "$d" != null ] || { echo "::error::no digest for $arch"; exit 1; }
            echo "$arch=$d" >>"$GITHUB_OUTPUT"
          done
          docker buildx imagetools create -t "$REPO:$VERSION" \
            "$REPO@$(grep '^amd64=' "$GITHUB_OUTPUT" | cut -d= -f2)" \
            "$REPO@$(grep '^arm64=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          # The plain listing's Digest line, as deploy.sh reads it: `--format`
          # is not honoured by every runner's buildx (Blacksmith's prints the
          # raw listing, which breaks $GITHUB_OUTPUT).
          index="$(docker buildx imagetools inspect "$REPO:$VERSION" | awk '/^Digest:/{print $2; exit}')"
          [[ "$index" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no index digest for $REPO:$VERSION"; exit 1; }
          echo "index=$index" >>"$GITHUB_OUTPUT"
      - name: record the digests for the deploy manifest
        run: |
          jq -n --arg repository "$REPO" --arg index "${{ steps.push.outputs.index }}" \
            --arg amd64 "${{ steps.push.outputs.amd64 }}" --arg arm64 "${{ steps.push.outputs.arm64 }}" \
            '{repository: $repository, index: $index, amd64: $amd64, arm64: $arm64}' \
            >"$RUNNER_TEMP/digests-${{ matrix.image }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}
          path: ${{ runner.temp }}/digests-${{ matrix.image }}.json
          retention-days: 7
      # Attestations only, as before v4: actions/attest (which v4 wraps) also
      # writes an artifact-metadata storage record on a registry push unless
      # told not to, and this job grants no artifact-metadata permission.
      - name: provenance for the amd64 image
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.push.outputs.amd64 }}
          push-to-registry: true
          create-storage-record: false
      - name: provenance for the arm64 image
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.push.outputs.arm64 }}
          push-to-registry: true
          create-storage-record: false
      - name: provenance for the index
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.push.outputs.index }}
          push-to-registry: true
          create-storage-record: false
      - name: summary
        run: |
          printf '### Published\n\n- `%s:%s` (index %s)\n- amd64 %s\n- arm64 %s\n' \
            "$REPO" "$VERSION" "${{ steps.push.outputs.index }}" \
            "${{ steps.push.outputs.amd64 }}" "${{ steps.push.outputs.arm64 }}" >>"$GITHUB_STEP_SUMMARY"

  # Assembles deploy-manifest-<version>.json from both publish legs' digests
  # (deploy/manifest.schema.json; scripts/deploy.sh release reads it). Read-only:
  # the manifest is a workflow artifact here, and attach-manifest alone writes
  # to the release. A scratch version gets none.
  manifest:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.scratch != 'true' }}
    runs-on: ${{ vars.QCR_RUNNERS == 'github' && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: write and validate the manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manifest"
          out="$RUNNER_TEMP/manifest/deploy-manifest-$VERSION.json"
          node scripts/emit-deploy-manifest.mjs --version "$VERSION" --revision "${{ github.sha }}" \
            --digests "$RUNNER_TEMP/digests" --out "$out"
          node scripts/deploy-manifest.mjs "$out" "$VERSION" >/dev/null
          printf '### Deploy manifest\n\n```json\n%s\n```\n' "$(cat "$out")" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-manifest-${{ env.VERSION }}
          path: ${{ runner.temp }}/manifest/deploy-manifest-${{ env.VERSION }}.json

  # The only job that writes to the repository's contents. Actions sets
  # permissions per job, not per step, so this is its own job: publish keeps
  # packages: write without contents: write.
  attach-manifest:
    needs: [plan, publish, manifest]
    if: ${{ !cancelled() && needs.manifest.result == 'success' }}
    runs-on: ${{ vars.QCR_RUNNERS == 'github' && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-manifest-${{ env.VERSION }}
          path: ${{ runner.temp }}/manifest
      - name: attach it to the release
        run: |
          set -euo pipefail
          gh release view "v$VERSION" >/dev/null 2>&1 ||
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes "Images: deploy-manifest-$VERSION.json lists them by digest."
          gh release upload "v$VERSION" "$RUNNER_TEMP/manifest/deploy-manifest-$VERSION.json" --clobber

  # Stages both npm packages from the tagged source, once the images of the
  # same version are on ghcr; a maintainer approves each staged version with
  # 2FA, and only then is it public. A real tag push only: never a scratch
  # version, never a manual dispatch. It runs in the npm-publish environment,
  # which admits v*.*.* tags alone and is the environment both packages'
  # trusted publishers name. The second registry login of this workflow, and
  # npmjs's alone: npm trades the job's OIDC token (id-token: write) for a
  # short-lived one that can stage and nothing more, so no step here runs a
  # plain `npm publish`. No secret and no .npmrc token: setup-node is given
  # no registry-url, whose placeholder token would be sent with every npm
  # call. GitHub's own runner, whatever QCR_RUNNERS says: npm takes trusted
  # publishing and provenance from GitHub-hosted runners only. No npm cache:
  # the tarballs are built from the lockfile and nothing else.
  npm:
    needs: [plan, build, publish]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push'
      && github.ref_type == 'tag'
      && needs.plan.outputs.publish == 'true'
      && needs.plan.outputs.scratch != 'true'
      && needs.build.result == 'success'
      && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: the packages are the tag's version
        id: versions
        run: |
          set -euo pipefail
          die() { echo "::error::npm release: $*"; exit 1; }
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || die "the plan's version $VERSION is not the tag $GITHUB_REF_NAME"
          root="$(node -p 'require("./package.json").version')"
          plugin="$(node -p 'require("./packages/pi-plugin/package.json").version')"
          pin="$(node -p 'require("./package.json").dependencies["@quickchatai/pi-quickreview"] ?? ""')"
          [ "$root" = "$VERSION" ] || die "package.json is $root, the tag is v$VERSION"
          [ "$plugin" = "$VERSION" ] || die "packages/pi-plugin/package.json is $plugin, the tag is v$VERSION"
          [ "$pin" = "$VERSION" ] || die "package.json pins @quickchatai/pi-quickreview at '$pin', not exactly $VERSION"
      # `npm stage` needs npm 11.15.0 or later (trusted publishing needs
      # 11.5.1, which that covers); an older npm has no staged route at all.
      - name: npm is new enough for staged publishing
        run: |
          set -euo pipefail
          have="$(npm --version)"
          printf '11.15.0\n%s\n' "$have" | sort -V -C ||
            { echo "::error::npm $have is older than 11.15.0, which npm stage needs"; exit 1; }
      - run: npm ci
      # The tarballs are the unit: the same files are kept as the artifact and
      # staged, so a hand publish after a refused stage ships exactly them.
      - name: pack the plugin and the app
        id: pack
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/npm"
          mkdir -p "$dest"
          npm pack --workspace packages/pi-plugin --pack-destination "$dest"
          npm pack --pack-destination "$dest"
          # npm names a tarball after the package, scope folded in:
          # @scope/name -> scope-name-<version>.tgz
          for k in plugin:packages/pi-plugin app:.; do
            name="$(node -p "require('./${k#*:}/package.json').name")"
            name="${name#@}"
            tgz="$dest/${name//\//-}-$VERSION.tgz"
            [ -f "$tgz" ] || { echo "::error::npm pack left no $tgz"; exit 1; }
            echo "${k%%:*}=$tgz" >>"$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs-${{ env.VERSION }}
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error
      - name: stage the plugin, then the app
        env:
          PUBLIC: ${{ github.event.repository.visibility == 'public' }}
          PLUGIN_TGZ: ${{ steps.pack.outputs.plugin }}
          APP_TGZ: ${{ steps.pack.outputs.app }}
        run: |
          set -euo pipefail
          # A prerelease never moves `latest`: `qcr update` installs that tag.
          dist_tag=latest
          [[ "$VERSION" == *-* ]] && dist_tag=next
          args=(--tag "$dist_tag" --access public)
          provenance=no
          if [ "$PUBLIC" = true ]; then
            args+=(--provenance)
            provenance=yes
          fi
          on_registry() { [ "$(npm view "$1@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; }
          failed=0
          staged=()
          # A refused stage does not stop the other package's attempt; the
          # step fails at the end if either was refused.
          stage() {
            local dir="$1" tgz="$2" name
            name="$(node -p "require('./$dir/package.json').name")"
            if on_registry "$name"; then
              echo "- \`$name@$VERSION\`: skipped, already on the registry" >>"$GITHUB_STEP_SUMMARY"
              return 0
            fi
            if npm stage publish "$tgz" "${args[@]}"; then
              staged+=("$name")
              echo "- \`$name@$VERSION\`: staged under dist-tag $dist_tag (trusted publishing, provenance: $provenance)" >>"$GITHUB_STEP_SUMMARY"
            else
              failed=1
              echo "::error::npm stage publish refused $name@$VERSION"
              echo "- \`$name@$VERSION\`: failed to stage. A refused login means the package's trusted publisher is missing or names another workflow or environment: \`.github/npm-trust.sh --apply\` sets it, then re-run this job. Or publish the tarball from the artifact npm-tarballs-$VERSION by hand with 2FA (\`npm publish $(basename "$tgz") --access public\`), the plugin first." >>"$GITHUB_STEP_SUMMARY"
            fi
          }
          printf '### npm\n\n' >>"$GITHUB_STEP_SUMMARY"
          # The plugin first: the app pins it at exactly this version.
          stage packages/pi-plugin "$PLUGIN_TGZ"
          stage . "$APP_TGZ"
          if [ "${#staged[@]}" -gt 0 ]; then
            printf '\nNothing staged is public until a maintainer approves it with 2FA, the plugin before the app:\n\n' >>"$GITHUB_STEP_SUMMARY"
            for name in "${staged[@]}"; do
              printf -- "- \`npm stage list %s\`, then \`npm stage approve <stage-id>\` (or Approve on npmjs.com)\n" "$name" >>"$GITHUB_STEP_SUMMARY"
            done
          fi
          exit "$failed"
