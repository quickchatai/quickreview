# Pull request intake (CONTRIBUTING.md, "How a change gets in").
#
# An outside contributor's PR must link an open issue (`Closes #N`) and carry
# its QuickReview self-review report. While either is missing, one comment
# (edited in place) names what is, and this check fails on a PR that asks for
# review; a draft is not asking yet, so on a draft it passes. It never changes
# a PR's draft state: GitHub refuses the workflow's own token the
# convertPullRequestToDraft mutation. A maintainer's PR is not checked: author
# association OWNER, MEMBER or COLLABORATOR, or else an author whose
# permission on the repository is admin or write (an org member whose
# membership is private reads as CONTRIBUTOR). A bot's PR is left alone.
#
# The trigger is pull_request_target, so the run sees a fork's PR with a write
# token and without waiting for the approval that fork CI waits for. That is
# safe only because nothing here reads the PR's code: no checkout, no script
# from the PR, and the PR's text reaches the shell as environment variables,
# never interpolated into it. Keep it that way. It runs on GitHub's own runner,
# never on Blacksmith's.
name: PR intake

on:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: pr-intake-${{ github.event.pull_request.number }}

jobs:
  intake:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      ACTION: ${{ github.event.action }}
      DRAFT: ${{ github.event.pull_request.draft }}
      ASSOCIATION: ${{ github.event.pull_request.author_association }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: an issue and the self-review before review
        run: |
          set -euo pipefail
          MARK="<!-- qcr-pr-intake -->"
          comment_id() {
            gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARK\"))) | .id" | head -n1 || true
          }
          say() {
            local id
            id=$(comment_id)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$MARK"$'\n'"$1" >/dev/null
            elif [ "${2:-}" != only-if-said ]; then
              gh pr comment "$PR" --repo "$REPO" --body "$MARK"$'\n'"$1" >/dev/null
            fi
          }

          case "$ASSOCIATION" in OWNER | MEMBER | COLLABORATOR) exit 0 ;; esac
          perm=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in admin | write) exit 0 ;; esac

          body=$(printf '%s' "$BODY" | tr -d '\r')
          missing=()

          issue=$(printf '%s\n' "$body" | grep -ioE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | head -n1 | grep -oE '[0-9]+$' || true)
          if [ -z "$issue" ]; then
            missing+=("- an open issue, linked as \`Closes #<issue>\`")
          else
            kind=$(gh api "repos/$REPO/issues/$issue" --jq 'if .pull_request then "a pull request" else .state end' 2>/dev/null || echo "not found")
            [ "$kind" = open ] || missing+=("- an open issue: #$issue is $kind")
          fi

          # The report qcr review --out writes always says "N finding(s)." or
          # "No findings." (renderMarkdown, packages/pi-plugin/src/reviewdest.ts).
          review=$(printf '%s\n' "$body" | sed -n '/^## QuickReview self-review/,/^### What I did with each finding/p')
          printf '%s\n' "$review" | grep -qE '^([0-9]+ findings?|No findings)\.$' ||
            missing+=("- the QuickReview self-review: the whole \`qcr-review.md\` pasted under \"QuickReview self-review\"")

          if [ ${#missing[@]} -eq 0 ]; then
            say "Everything the intake asks for is here." only-if-said
            exit 0
          fi
          list=$(printf '%s\n' "${missing[@]}")
          if [ "$DRAFT" = true ]; then
            say "Thanks for the PR. Before it is ready for review it needs:"$'\n\n'"$list"$'\n\n'"See CONTRIBUTING.md, \"How a change gets in\". Edit the description, then mark it ready for review."
            echo "::notice::missing: ${missing[*]}"
            exit 0
          fi
          say "This PR asks for review but is not ready for it. It needs:"$'\n\n'"$list"$'\n\n'"See CONTRIBUTING.md, \"How a change gets in\". Edit the description and this check runs again, or convert the PR to a draft until it is done."
          echo "::error::missing: ${missing[*]}"
          exit 1
