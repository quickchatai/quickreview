# Public CI for the quickreviewd snapshot. Rides the assembled tree;
# harmless in the private repo, which has no GitHub remote (local git only).
#
# Deliberately minimal and offline-true: no secrets, no external services —
# the suite mocks all I/O, and the publishability lint
# (tests/publishability.test.ts, part of `npm test`) re-verifies on every
# push that no private token entered the tree.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # BUILD BEFORE TEST, not after. Three suites — tests/exec-boundary.test.ts,
      # tests/fences.test.ts and tests/park-retired.test.ts — load the COMPILED
      # module out of dist/ on purpose, because what they assert is that the
      # emitted artifact still agrees with the source (the container runs the
      # build, not the source). On a fresh checkout there is no dist/ yet, so
      # running the suite first fails 8 tests in those 3 files with
      # "Cannot find module .../dist/...". Verified 2026-09-02.
      - run: npm run build
      - run: timeout 900 npm test # full suite incl. the publishability lint
