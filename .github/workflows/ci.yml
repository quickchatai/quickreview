# CI for qcr, on the public repository and on any fork's copy alike.
#
# Deliberately minimal and offline-true: no secrets, no external services, no
# model. The suite mocks all I/O, and the publishability lint
# (tests/publishability.test.ts, part of `npm test`) re-verifies on every
# push that no private token entered the tree. The `image` job builds the
# release image (docker/Dockerfile) and smokes it with no model either
# (.github/ci/image-smoke.sh); it pushes nothing, and release.yml owns that. The
# `clone` job keeps the native developer install honest (a fresh checkout,
# npm ci, npm run build, then the wrapper's version and review --preview on a
# fixture repo): no docker, no model, and the user docs leave that route out.
#
# Runners: Blacksmith's (blacksmith-*), which the org's Blacksmith app serves.
# A repo without that app, a fork included, sets the repository
# variable QCR_RUNNERS=github and every job runs on GitHub's own runners. A pull
# request from a fork always runs on GitHub's own runners (free for a public
# repo), so outside code never runs on the paid ones; it also waits for a
# maintainer to approve the run (the repo's fork-PR approval setting,
# docs/repo-settings.md).
#
# Each run does only what its change needs. The `changes` job diffs the PR's
# merge commit against its base (a push: against the previous head of main)
# and .github/ci/changes.mjs decides which jobs that diff needs: a docs-only
# change runs the docs-reading tests alone, with no lint, build, image or
# clone; an unknown change, or one to this file or the classifier, runs
# everything. The `ci` job is the one required check: it passes when every job
# that ran passed and every job `changes` asked for ran
# (tests/ci-changes.test.ts holds the rules).
#
# A draft pull request runs nothing. CI starts when a PR is opened (or
# reopened) as ready, or marked ready for review, and runs again on each push
# after that.
# A newer push to the same PR cancels the run it replaces.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this change needs (.github/ci/changes.mjs). The base is the merge
  # commit's first parent on a PR, which is the base branch as the merge saw
  # it, and the previous head on a push; an unknown base runs everything.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (vars.QCR_RUNNERS == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2404' }}
    outputs:
      full: ${{ steps.classify.outputs.full }}
      lint: ${{ steps.classify.outputs.lint }}
      image: ${{ steps.classify.outputs.image }}
      clone: ${{ steps.classify.outputs.clone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base=$(git rev-parse HEAD^1); else base="$BEFORE"; fi
          node .github/ci/changes.mjs classify "$base"

  # eslint (type-aware) and prettier, side by side. Neither needs the build:
  # project references resolve the core's types from its sources.
  lint:
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: ${{ (vars.QCR_RUNNERS == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'blacksmith-8vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: lint and format:check
        run: |
          npm run format:check > "$RUNNER_TEMP/format.log" 2>&1 &
          format=$!
          lint=0; npm run lint || lint=$?
          fmt=0; wait "$format" || fmt=$?
          cat "$RUNNER_TEMP/format.log"
          exit $(( lint || fmt ))

  # The build and the whole suite, or, for a docs-only change, the tests that
  # read docs (DOCS_SUITE in .github/ci/changes.mjs) with no build.
  test:
    needs: changes
    runs-on: ${{ (vars.QCR_RUNNERS == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'blacksmith-16vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      # Build before test. Some suites (e.g. tests/exec-boundary.test.ts,
      # tests/fences.test.ts) load the compiled module out of dist/ on purpose,
      # because what they assert is that the emitted artifact still agrees with
      # the source (the container runs the build, not the source). On a fresh
      # checkout there is no dist/ yet, so running the suite first fails them
      # with "Cannot find module .../dist/...".
      - if: ${{ needs.changes.outputs.full == 'true' }}
        run: npm run build
      # 25 minutes: the suite passed 900 s on the 2-CPU hosted runner once the
      # worker world landed (13,500 tests); locally it stays under 900 s.
      - if: ${{ needs.changes.outputs.full == 'true' }}
        run: timeout 1500 npm test # full suite incl. the publishability lint
      - name: docs-reading tests (a docs-only change)
        if: ${{ needs.changes.outputs.full != 'true' }}
        run: timeout 300 npx vitest run $(node .github/ci/changes.mjs docs-suite)
      # The pi canaries (tests/pi-canary/) already ran inside `npm test`. A bump
      # of the pi pin is gated by them by name: when the pi dependencies moved
      # (declared in package.json or resolved in the lockfile), run them again
      # on their own, so a bump cannot merge without a separate canary result.
      # The comparison base is the pull request's base branch, or the previous
      # head of a push; an unknown base (a first push) counts as changed.
      - name: pi dependencies changed?
        id: pi
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="${BASE_REF:-$BEFORE}"
          changed=true
          if [ -n "$base" ] && ! [[ "$base" =~ ^0+$ ]] && git fetch --no-tags --depth=1 origin "$base"; then
            changed=$(node --input-type=commonjs - <<'JS'
          const { execFileSync } = require("node:child_process");
          const { readFileSync } = require("node:fs");
          const PI = ["@earendil-works/pi-ai", "@earendil-works/pi-coding-agent"];
          const pins = (rev) => {
            const read = (f) => JSON.parse(rev ? execFileSync("git", ["show", `${rev}:${f}`], { encoding: "utf8" }) : readFileSync(f, "utf8"));
            const declared = read("package.json").dependencies ?? {};
            const resolved = read("package-lock.json").packages ?? {};
            return JSON.stringify(PI.map((n) => [declared[n] ?? null, resolved[`node_modules/${n}`]?.version ?? null]));
          };
          process.stdout.write(pins("FETCH_HEAD") === pins("") ? "false" : "true");
          JS
            )
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: pi canaries (required when the pi dependencies change)
        if: steps.pi.outputs.changed == 'true'
        run: timeout 300 npm run canary:pi

  # The release image, built and run once with no model: version, the schema
  # versions, review --preview on a fixture repo, the host wrapper installed
  # into a temp dir, and the runner's kernel.yama.ptrace_scope in the summary.
  # amd64 only (the runner's own arch); the per-arch smoke is the release
  # workflow's. BuildKit is named because docker/Dockerfile.dockerignore (the
  # release context's allowlist) is only read by it.
  image:
    needs: changes
    if: ${{ needs.changes.outputs.image == 'true' }}
    runs-on: ${{ (vars.QCR_RUNNERS == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'blacksmith-8vcpu-ubuntu-2404' }}
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Blacksmith's builder, made the current buildx builder, so the build below
      # reuses its layer cache. It must be `docker buildx build`: plain `docker
      # build` goes to the "default" instance and never reads that cache. Off a
      # Blacksmith runner (QCR_RUNNERS=github, or a fork's PR) it is skipped.
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        if: ${{ vars.QCR_RUNNERS != 'github' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        with:
          cache-key: ci-release-amd64
      - name: build the release image
        run: docker buildx build --load -f docker/Dockerfile --build-arg "BUILD_SHA=${GITHUB_SHA}" -t qcr-ci:smoke .
      - name: offline smoke
        run: .github/ci/image-smoke.sh qcr-ci:smoke

  # The clone route, with no Docker: a fresh checkout built the way a developer
  # builds it, then scripts/qcr answers `version --json` and `review --preview
  # --json` on a fixture repo (.github/ci/clone-smoke.sh). Offline and with no
  # model, like the image job, and nothing is pushed.
  clone:
    needs: changes
    if: ${{ needs.changes.outputs.clone == 'true' }}
    runs-on: ${{ (vars.QCR_RUNNERS == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: offline smoke
        run: .github/ci/clone-smoke.sh

  # The one required check. It passes when every job that ran passed and every
  # job `changes` asked for ran; a skipped job counts only when it was not
  # needed. always(), not !cancelled(): GitHub counts a skipped required check
  # as passed, so a cancelled run must fail here rather than skip.
  ci:
    needs: [changes, lint, test, image, clone]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ${{ (vars.QCR_RUNNERS == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/ci/changes.mjs gate
