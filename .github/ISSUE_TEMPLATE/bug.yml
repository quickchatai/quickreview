name: Bug
description: Something QuickReview does wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The commands you ran, and the PR or diff shape if it is about a review.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The daemon log excerpt, and for review behaviour the round's verdict and ledger context. Remove secrets first.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `qcr version`.
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: How you run it
      options:
        - Docker image (qcr, the home)
        - npm package (qcr review)
        - pi plugin
        - GitHub Action
        - From a clone
    validations:
      required: true
