# fast — the cheap, quick review: every model at low reasoning, the bug-finding
# lenses only, concise comments (profiles/fast/README.md).
#
# Select it with `[review] profile = "fast"` AND `[review] preset = "low"` —
# the preset lowers the main session's reasoning and every tier, which a
# profile cannot reach; the `effort = "low"` lines below make every lens that
# is pinned high by default (and the validator) low even without the preset.
#
# Everything the review posts is still judged exactly as `default` judges it —
# the blocker bar, the reachability gate, red CI, NIT SCOPE and the
# validator's doubt-not-kill mark are untouched. There is no comment cap: the
# review still reports every problem it finds. What changes is how hard each
# lens thinks and which lenses run.
extends = "default"

[posting]
comment_style = "concise"

# Every lens pinned at deep by default (DEFAULT_PASS_TIERS: the lenses that
# read every changed line, and the state-machine family whenever a trigger,
# a request or a profile plans one), and the validator: low thinking.
[lenses.pass-baseline]
effort = "low"

[lenses.pass-sweep]
effort = "low"

[lenses.pass-behaviour-delta]
effort = "low"

[lenses.pass-validate]
effort = "low"

[lenses.pass-sm-states]
effort = "low"

[lenses.pass-sm-transitions]
effort = "low"

[lenses.pass-sm-exhaustive]
effort = "low"

[lenses.pass-sm-stuck]
effort = "low"

[lenses.pass-sm-events]
effort = "low"

[lenses.pass-sm-derived]
effort = "low"

[lenses.pass-sm-lifecycle]
effort = "low"

[lenses.pass-sm-durable]
effort = "low"

# Off: the lenses that find true but non-bug issues (quality, style,
# placement, intent drift) — the same a-priori set as `snappy`, minus
# pass-ui (which finds UI bugs and is planned only on UI files) and plus
# pass-lint-conformance, which `snappy` leaves on.
[lenses.pass-maintainability]
enabled = false

[lenses.pass-duplication]
enabled = false

[lenses.pass-abstraction]
enabled = false

[lenses.pass-consistency]
enabled = false

[lenses.pass-style]
enabled = false

[lenses.pass-lint-conformance]
enabled = false

[lenses.pass-placement]
enabled = false

[lenses.pass-intent]
enabled = false
