# The QuickReview Action.
#
# A composite. Its first step after the runner check is the gate, which makes
# GitHub reads only and spends nothing: it finds the pull request the event
# names (or the pr input), checks that whoever started the run may start a
# review (write access to the repository, or allowed-users), that the pull
# request is open, and that the step has a model credential. A run it turns
# down is skipped, with the reason in the outputs and the job summary. Then
# the Action checks that the release image can be pulled (it is public, so
# anonymously; a private mirror logs in with registry-token), and runs the
# image's `review` once for that pull request, posting a comment-only review
# unless post is "false". The result is in the outputs and the job summary.
# Everything it does is in scripts/action.sh (one verb per step), so it can be
# read, tested with a fake docker, and linted outside a workflow.
# docs/action.md says how to use it; docs/action/qcr-review.yml is a workflow
# to copy. The workflow decides when the Action runs.
#
# The review container gets: the checkout read-only, a generated config
# (dry_run = false, memory off), the pi login read-only, QCR_ROUTE=action (no
# default cost cap, nothing asked) and the GitHub token as a read-once file in
# $RUNNER_TEMP, never in the environment or the command line.
#
# A model credential reaches the review by name only: the step forwards every
# environment name pi reads a credential from, whatever the provider, so a key
# is set with the workflow's own `env:` on the step that uses this Action. The
# four key inputs below are the same route under older names. The gate is told
# only whether a key input or pi-auth was given, never their values.
name: QuickReview AI Code Review
description: Review a pull request with QuickReview, an open-source AI code reviewer, and post the findings as one comment-only review.
branding:
  icon: eye
  color: blue

inputs:
  pr:
    description: >-
      The pull request number. Default is the pull request the event names (a
      pull_request event, or a comment on a pull request). An event that names
      none, such as workflow_dispatch or schedule, needs it.
    required: false
    default: ""
  repo:
    description: The repository of the pull request, OWNER/NAME.
    required: false
    default: ${{ github.repository }}
  github-token:
    description: >-
      The token the review reads the pull request and posts with. It needs
      pull-requests: write.
    required: false
    default: ${{ github.token }}
  allowed-users:
    description: >-
      Who else may start a review, beyond people with write access to the
      repository: GitHub logins separated by commas (a bot as name[bot]), or *
      for anyone. Default is nobody else.
    required: false
    default: ""
  registry-token:
    description: >-
      Only for an image that is not public (a private mirror, named by the image
      input): a token that can read it, as a secret. The release image is public and
      is pulled anonymously without one. Used for docker login and the preflight only.
    required: false
    default: ""
  registry-user:
    description: The user docker logs in as, with registry-token.
    required: false
    default: ${{ github.actor }}
  limit:
    description: A cost limit in USD for this review. There is no default limit; with none, the review is not capped.
    required: false
    default: ""
  model:
    description: >-
      The model the review runs on, as pi names it (provider/model, with an
      optional :level). Default is the newest model of the provider whose
      credential the step has.
    required: false
    default: ""
  profile:
    description: >-
      A shipped review profile to run instead of the standard review, such as
      security or state-machines (docs/action.md lists them). The repository's
      own .qcr/ profile applies either way.
    required: false
    default: ""
  post:
    description: >-
      "true" posts the review on the pull request. "false" reviews, shows the
      result in the job summary and the outputs, and posts nothing.
    required: false
    default: "true"
  pi-auth:
    description: >-
      The contents of a pi auth.json (a model login for any provider), as a
      secret. Not needed when the step's env carries an API key.
    required: false
    default: ""
  openai-api-key:
    description: >-
      A model API key, as a secret. Any other provider's key goes in the step's
      own env, under the name pi reads it from (docs/action.md).
    required: false
    default: ""
  anthropic-api-key:
    description: A model API key, as a secret.
    required: false
    default: ""
  gemini-api-key:
    description: A model API key, as a secret.
    required: false
    default: ""
  digitalocean-api-key:
    description: >-
      A model API key, as a secret. pi has no built-in provider for it: the
      login given as pi-auth must define one in its models.json.
    required: false
    default: ""
  image:
    description: >-
      An image reference to run instead of the release image at this action's ref
      (ghcr.io/OWNER/NAME:VERSION from package.json).
    required: false
    default: ""

outputs:
  skipped:
    description: >-
      "true" when the Action decided not to review this run (skip-reason says
      why), else "false".
    value: ${{ steps.gate.outputs.skipped }}
  skip-reason:
    description: Why the Action did not review, in one line. Empty when it reviewed.
    value: ${{ steps.gate.outputs.skip-reason }}
  pr:
    description: The number of the pull request reviewed. Empty when none was.
    value: ${{ steps.gate.outputs.pr }}
  review-url:
    description: The link to the posted review. Empty when nothing was posted.
    value: ${{ steps.run.outputs.review-url }}
  verdict:
    description: >-
      APPROVE, REQUEST_CHANGES, or empty. The review is posted as a comment
      either way, with the verdict in its text.
    value: ${{ steps.run.outputs.verdict }}
  findings:
    description: >-
      The number of findings, over every severity. Empty when the result holds
      no findings at all, as when the review was refused or printed no result.
    value: ${{ steps.run.outputs.findings }}
  cost-usd:
    description: What the review cost in US dollars, as the image reports it. Empty when unknown.
    value: ${{ steps.run.outputs.cost-usd }}
  result:
    description: >-
      The whole review result as JSON on one line (schema 2,
      schemas/review-result.v2.json). Empty when the review printed none.
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Check the runner
      shell: bash
      run: |
        if [ "$RUNNER_OS" != Linux ]; then
          echo "::error::qcr runs a Docker image: use a Linux runner"
          exit 1
        fi
        command -v docker >/dev/null || { echo "::error::docker is not installed on this runner"; exit 1; }

    - name: Decide whether to review this run
      id: gate
      shell: bash
      env:
        QCR_ACTION_PATH: ${{ github.action_path }}
        QCR_ACTION_PR: ${{ inputs.pr }}
        QCR_ACTION_REPO: ${{ inputs.repo }}
        QCR_ACTION_GH_TOKEN: ${{ inputs.github-token }}
        QCR_ACTION_ALLOWED_USERS: ${{ inputs.allowed-users }}
        # Whether a key input or pi-auth was given, never their values.
        QCR_ACTION_HAS_KEY_INPUT: ${{ inputs.openai-api-key != '' || inputs.anthropic-api-key != '' || inputs.gemini-api-key != '' || inputs.digitalocean-api-key != '' }}
        QCR_ACTION_HAS_PI_AUTH: ${{ inputs.pi-auth != '' }}
      run: bash "$QCR_ACTION_PATH/scripts/action.sh" gate

    - name: Check this repository can pull the image
      if: steps.gate.outputs.skipped == 'false'
      shell: bash
      env:
        QCR_ACTION_PATH: ${{ github.action_path }}
        QCR_ACTION_IMAGE: ${{ inputs.image }}
        QCR_ACTION_REGISTRY_USER: ${{ inputs.registry-user }}
        QCR_ACTION_REGISTRY_TOKEN: ${{ inputs.registry-token }}
        QCR_ACTION_GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$QCR_ACTION_PATH/scripts/action.sh" preflight

    - name: Log in to a private mirror (registry-token only)
      if: steps.gate.outputs.skipped == 'false'
      shell: bash
      env:
        QCR_ACTION_PATH: ${{ github.action_path }}
        QCR_ACTION_IMAGE: ${{ inputs.image }}
        QCR_ACTION_REGISTRY_USER: ${{ inputs.registry-user }}
        QCR_ACTION_REGISTRY_TOKEN: ${{ inputs.registry-token }}
        QCR_ACTION_GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$QCR_ACTION_PATH/scripts/action.sh" login

    - name: Review the pull request
      id: run
      if: steps.gate.outputs.skipped == 'false'
      shell: bash
      env:
        QCR_ACTION_PATH: ${{ github.action_path }}
        QCR_ACTION_IMAGE: ${{ inputs.image }}
        QCR_ACTION_PR: ${{ steps.gate.outputs.pr }}
        QCR_ACTION_REPO: ${{ inputs.repo }}
        QCR_ACTION_LIMIT: ${{ inputs.limit }}
        QCR_ACTION_MODEL: ${{ inputs.model }}
        QCR_ACTION_PROFILE: ${{ inputs.profile }}
        QCR_ACTION_POST: ${{ inputs.post }}
        QCR_ACTION_GH_TOKEN: ${{ inputs.github-token }}
        QCR_ACTION_PI_AUTH: ${{ inputs.pi-auth }}
        # The key inputs travel under names of their own, so an empty input
        # never blanks a key the workflow set in the step's env.
        QCR_ACTION_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        QCR_ACTION_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        QCR_ACTION_GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        QCR_ACTION_DIGITALOCEAN_API_KEY: ${{ inputs.digitalocean-api-key }}
      run: bash "$QCR_ACTION_PATH/scripts/action.sh" run

    - name: Remove what the action staged
      if: always()
      shell: bash
      env:
        QCR_ACTION_PATH: ${{ github.action_path }}
      run: bash "$QCR_ACTION_PATH/scripts/action.sh" cleanup
