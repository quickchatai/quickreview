# Plain Docker path — build and run the review daemon on any host.
#
#   docker compose up -d --build
#
# Prerequisites: a secrets dir (default ~/.config/quickreview-bot — override
# with QCR_SECRETS_DIR) holding at least app_id, app.pem, webhook_secret;
# optional openai_api_key (pi's API-key route), openviking_root_key,
# openviking_reviewer_key, and openai_embeddings_api_key (only under the
# hosted-embeddings opt-in — memory embeds locally by default).
# Ingress is the operator's choice, and the wizard's ingress step
# makes it for you. Four shapes, three of them a SIDECAR in this file, each
# behind its own compose profile — with no profile selected you get the daemon
# ALONE, which is the polling-only shape:
#
#   COMPOSE_PROFILES=quick-tunnel   cloudflared quick tunnel; no account, the
#                                   hostname ROTATES and the daemon re-points
#                                   the App's webhook URL itself ([ingress]
#                                   shape = "tunnel-file")
#   COMPOSE_PROFILES=ngrok          ngrok; needs an account + authtoken file,
#                                   free-tier request/bandwidth caps apply,
#                                   hostname stable with a reserved domain
#   COMPOSE_PROFILES=named-tunnel   your own Cloudflare tunnel token + your own
#                                   domain (the VM route's default shape)
#   (unset)                         no tunnel at all — the reconcile poll is
#                                   the trigger path ([daemon] poll_interval_s)
#
# The wizard writes the profile into the project's .env; set it by hand with
# `COMPOSE_PROFILES=quick-tunnel docker compose up -d` if you prefer. Any other
# HTTPS proxy or tunnel pointed at the published webhook port also works.
# See docker/daemon/README.md.
#
# Pins: the image versions (pi, OpenViking, llama-cpp-python,
# tmux) are the Dockerfile's ARG defaults, mirrored against config.toml and
# deploy/ansible/group_vars/all.yml by tests/docker-daemon.test.ts — drift
# refuses there. Do not override the build args casually: a bump is a
# deliberate act recorded in ALL the mirror locations.
name: quickreview

services:
  daemon:
    build:
      context: docker/daemon
      args:
        # The repo is bind-mounted and the entrypoint builds in it — the
        # container user must own your checkout's files. Set QCR_UID=$(id -u)
        # (the default 1001 matches the templated VM image).
        REVIEW_UID: ${QCR_UID:-1001}
    image: quickreview-sandbox:v1
    # PID-1 discipline: with a supervised OpenViking process beside
    # the daemon, PID 1 must reap. tini forwards signals and adopts orphans.
    init: true
    restart: unless-stopped
    # Resource caps — same defaults as the live VM (a shared box). Raise via
    # QCR_CPUS / QCR_MEMORY if the host is yours alone.
    cpus: ${QCR_CPUS:-2}
    mem_limit: ${QCR_MEMORY:-8g}
    memswap_limit: ${QCR_MEMORY:-8g}
    # The webhook port is the ONLY thing this container publishes, and on
    # loopback by default — put your HTTPS ingress in front of it. OpenViking's
    # port (1933) is deliberately absent: it is loopback-INSIDE-the-container,
    # reachable by the daemon and the pi sessions and by nothing else. Do not
    # publish it.
    ports:
      - "${QCR_WEBHOOK_BIND:-127.0.0.1}:${QCR_WEBHOOK_PORT:-8787}:8787"
    volumes:
      # The repo itself IS the sandbox (the entrypoint runs npm ci + build on
      # first boot and symlinks <sandbox>/state onto the state volume).
      - ./:/opt/quickreview/sandbox
      # The state volume, mounted at BOTH paths on purpose:
      # /opt/quickreview/state is the absolute path the docs, the TUI's
      # remote_state_dir and the ingress checks use, and <sandbox>/state is
      # where the code itself looks. Mounting it over the sandbox path is what
      # stops the entrypoint from replacing the operator's OWN state/ directory
      # — the sandbox is a bind mount of their checkout, and that directory
      # holds host-side files the TUI and the onboarding wizard read directly
      # (the onboarding checklist, the companion's rollover and alert state,
      # the first-run marker). The entrypoint detects the double mount by inode
      # and skips its legacy symlink migration.
      - qcr-state:/opt/quickreview/state
      - qcr-state:/opt/quickreview/sandbox/state
      # The tunnel sidecar's ONLY shared surface: the one directory holding
      # the hostname file the self-heal watcher reads (contract,
      # <root>/state/ingress/hostname — the default `[ingress] hostname_file`
      # resolves here through the entrypoint's state symlink). A nested mount
      # so the sidecar never sees the rest of the state volume: no SQLite, no
      # memory, no dry-run record.
      - qcr-ingress:/opt/quickreview/state/ingress
      # …and, for the same reason as the state volume above, at the sandbox
      # path too, so both spellings of the hostname file are the SAME file.
      - qcr-ingress:/opt/quickreview/sandbox/state/ingress
      - ${QCR_SECRETS_DIR:-~/.config/quickreview-bot}:/opt/quickreview/secrets:ro
      # The directory holding the live config.toml the install locator found
      # on the host — the install's config home, or wherever
      # QCR_CONFIG points. The bring-up step writes QCR_CONFIG_HOME and
      # QCR_CONFIG_NAME into .env and creates the directory first; the
      # entrypoint names the file only when it is there, so a legacy checkout
      # config (this dir mounted empty) still boots. Unset (compose run by
      # hand, before the wizard wrote .env) it defaults to a tracked dir with
      # no config.toml in it — never to ~/.config/qcr/<install>, which Docker
      # would create owned by root when it is missing. To run by hand on a
      # config home, set QCR_CONFIG_HOME in .env.
      - ${QCR_CONFIG_HOME:-./docker/daemon/no-config-home}:/opt/quickreview/config-home:ro
      # pi's home: OAuth tokens (auth.json), session JSONLs, models.json —
      # must survive container rebuilds (sticky sessions + /login tokens).
      - qcr-pihome:/home/review/.pi
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      QC_REVIEW_PORT: "8787"
      QCR_CONFIG_NAME: ${QCR_CONFIG_NAME:-config.toml}
      # The memory engine's embedder: local by default, so nothing
      # but the model call leaves the machine. A hosted opt-in is these four
      # in the project .env (the onboarding bring-up step mirrors them from
      # config.toml [openviking] embedding_*) plus <secrets>/<key file> — its
      # OWN file, never pi's openai_api_key. Defaults mirror config.toml.
      QCR_OPENVIKING_EMBEDDING_PROVIDER: ${QCR_OPENVIKING_EMBEDDING_PROVIDER:-local}
      QCR_OPENVIKING_EMBEDDING_MODEL: ${QCR_OPENVIKING_EMBEDDING_MODEL:-bge-small-zh-v1.5-f16}
      QCR_OPENVIKING_EMBEDDING_DIMENSION: ${QCR_OPENVIKING_EMBEDDING_DIMENSION:-512}
      QCR_OPENVIKING_EMBEDDING_KEY_FILE: ${QCR_OPENVIKING_EMBEDDING_KEY_FILE:-openai_embeddings_api_key}
      # In-container bind must be 0.0.0.0 — the published port targets the
      # container's eth0; host exposure stays loopback-only above.
      QC_BIND_HOST: "0.0.0.0"

  # ---- webhook ingress sidecars ---------------------------------
  # All three run the same wrapper (docker/tunnel/sidecar.mjs) around an
  # official vendor binary, and all three are OPTIONAL: no profile, no
  # sidecar. None of them publishes a port — the tunnel dials OUT and reaches
  # the daemon over the compose network, so nothing new is exposed on the
  # host. OpenViking's port (1933) stays unpublished and unreachable from any
  # of them; the sidecars mount one directory and, at most, the secrets dir.

  # The default laptop shape: no account, no signup, rotating hostname.
  # cloudflared prints the assigned *.trycloudflare.com name; the wrapper
  # writes it to the shared hostname file and the daemon re-points the App's
  # own webhook URL. A restart just writes the new name — nothing to fix by
  # hand, and the reconcile poll covers the gap either way.
  tunnel-quick:
    profiles: ["quick-tunnel"]
    build:
      context: docker/tunnel
      dockerfile: Dockerfile.cloudflared
    image: quickreview-tunnel-cloudflared:v1
    init: true
    restart: unless-stopped
    depends_on:
      - daemon
    environment:
      QCR_TUNNEL_KIND: quick
      QCR_TUNNEL_UPSTREAM: http://daemon:8787
      QCR_TUNNEL_HOSTNAME_FILE: /ingress/hostname
    volumes:
      - qcr-ingress:/ingress

  # Stable hostname, at the price of an account. The authtoken is a FILE in
  # the secrets dir (<secrets>/ngrok_authtoken), read by the wrapper and
  # handed to the client in its environment — never on a command line.
  # QCR_NGROK_DOMAIN is your reserved domain, if you have one; without it the
  # name still rotates and the self-heal still handles it.
  tunnel-ngrok:
    profiles: ["ngrok"]
    build:
      context: docker/tunnel
      dockerfile: Dockerfile.ngrok
    image: quickreview-tunnel-ngrok:v1
    init: true
    restart: unless-stopped
    depends_on:
      - daemon
    environment:
      QCR_TUNNEL_KIND: ngrok
      QCR_TUNNEL_UPSTREAM: http://daemon:8787
      QCR_TUNNEL_HOSTNAME_FILE: /ingress/hostname
      QCR_TUNNEL_DOMAIN: ${QCR_NGROK_DOMAIN:-}
    volumes:
      - qcr-ingress:/ingress
      - ${QCR_SECRETS_DIR:-~/.config/quickreview-bot}:/opt/quickreview/secrets:ro

  # Your own named Cloudflare tunnel: a permanent hostname on your domain,
  # driven by the connector token the secrets wizard collects (tunnel_token).
  # It writes NO hostname file — the name is yours and does not rotate, so
  # `[ingress] shape` stays "none" and `[server] hostname` carries it.
  tunnel-named:
    profiles: ["named-tunnel"]
    build:
      context: docker/tunnel
      dockerfile: Dockerfile.cloudflared
    image: quickreview-tunnel-cloudflared:v1
    init: true
    restart: unless-stopped
    depends_on:
      - daemon
    environment:
      QCR_TUNNEL_KIND: named
    volumes:
      - ${QCR_SECRETS_DIR:-~/.config/quickreview-bot}:/opt/quickreview/secrets:ro

volumes:
  qcr-state:
  qcr-pihome:
  # Shared by the daemon (read) and a tunnel sidecar (write): the hostname
  # file, and nothing else.
  qcr-ingress:
