# Copy to inventory.ini and fill in. The host alias comes from
# `gcloud compute config-ssh` (writes ~/.ssh/config entries for your VMs).

[quickreview]
quickreview-sandbox.your-zone.your-dev-project

[quickreview:vars]
ansible_user=your_oslogin_user
ansible_python_interpreter=/usr/bin/python3

# IAP-only alternative (no external IP, without config-ssh):
# ansible_ssh_common_args=-o ProxyCommand="gcloud compute start-iap-tunnel %h 22 --listen-on-stdin --project=your-dev-project --zone=your-zone"
