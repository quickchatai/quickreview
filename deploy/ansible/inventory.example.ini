# Copy to inventory.ini and fill in — inventory.ini is gitignored:
# it carries YOUR real hostnames and stays local to the controller machine.
#
# What to fill:
#   [quickreview] host   — any ssh-reachable name for the target VM: a plain
#                        hostname, an ~/.ssh/config alias, or (on GCP) the
#                        alias `gcloud compute config-ssh` writes.
#   ansible_user       — the remote login user (omit when your ssh config
#                        already sets it, e.g. via config-ssh / OS Login).
#   ansible_python_interpreter — leave as /usr/bin/python3 for Ubuntu/Debian.

[quickreview]
quickreview-sandbox.your-zone.your-dev-project

[quickreview:vars]
ansible_user=your_oslogin_user
ansible_python_interpreter=/usr/bin/python3

# GCP IAP-only alternative (no external IP, without config-ssh):
# ansible_ssh_common_args=-o ProxyCommand="gcloud compute start-iap-tunnel %h 22 --listen-on-stdin --project=your-dev-project --zone=your-zone"
