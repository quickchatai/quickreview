---
# Review-sandbox provisioning — one VM, one container, cloudflared on the host.
# See README.md in this directory. Idempotent; re-run freely.
#
#   ansible-playbook -i inventory.ini playbook.yml
#   ansible-playbook -i inventory.ini playbook.yml -e rebuild_image=true   # force image rebuild

- name: Preflight — refuse to trample the shared VM
  hosts: quickreview
  become: true
  tasks:
    - name: Is the sandbox already installed here? (re-runs are fine)
      ansible.builtin.stat:
        path: "{{ sandbox_root }}"
      register: sandbox_dir

    - name: Check whether the webhook port is already bound
      ansible.builtin.command: ss -ltnH sport = :{{ webhook_port }}
      register: port_check
      changed_when: false

    - name: "Fail: port {{ webhook_port }} is taken by something that is not us"
      ansible.builtin.fail:
        msg: >-
          Port {{ webhook_port }} is already bound on the VM and
          {{ sandbox_root }} does not exist — another service owns it. Pick a
          different webhook_port or free the port before deploying.
      when: not sandbox_dir.stat.exists and port_check.stdout | trim | length > 0

    - name: Check for a pre-existing cloudflared service
      ansible.builtin.systemd:
        name: cloudflared
      register: cf_service
      failed_when: false
      when: cloudflared_enabled | bool

    - name: "Fail: a foreign cloudflared already runs here"
      ansible.builtin.fail:
        msg: >-
          cloudflared.service is already active on the VM but the sandbox
          was never installed — it is serving someone else's tunnel. The
          `cloudflared service install` step would clobber it. Wire the
          quickreview hostname into the existing tunnel instead, or run the two
          side by side manually, then re-run with `-e cloudflared_enabled=false`.
      when: >-
        cloudflared_enabled | bool and
        not sandbox_dir.stat.exists and
        cf_service.status is defined and
        (cf_service.status.ActiveState | default('inactive')) == 'active'

    - name: "Fail: not enough free disk"
      ansible.builtin.fail:
        msg: "Less than {{ min_free_disk_gb }} GB free on / — the shared VM is too full for the image + worktrees."
      vars:
        root_mount: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | first }}"
      when: (root_mount.size_available | int) < (min_free_disk_gb | int) * 1024 * 1024 * 1024

# The cloudflared tasks below are OPTIONAL: `cloudflared_enabled`
# defaults true in group_vars — the live deployment keeps its tunnel — but any
# other HTTPS ingress to the published webhook port works just as well. Set
# `-e cloudflared_enabled=false` and bring your own proxy/tunnel; nothing else
# in this playbook depends on the tunnel existing.
- name: Host setup — packages, Docker, cloudflared tunnel (optional)
  hosts: quickreview
  become: true
  vars:
    base_packages: [python3-docker, git, curl, ca-certificates, gnupg, rsync]
  tasks:
    # Refresh the apt cache only when a package is actually missing. The VM
    # is shared and carries third-party repos we do not own; a broken one makes
    # python-apt's cache update fail (with an empty error), and an unconditional
    # update_cache would then fail every rebuild even with every package
    # already installed.
    - name: Installed packages
      ansible.builtin.package_facts:

    - name: Base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true
      when: base_packages | difference(ansible_facts.packages.keys() | list) | length > 0

    # The VM already runs Docker CE (containerd.io conflicts with
    # docker.io's containerd) — only install a Docker at all when none exists.
    - name: Is Docker already installed?
      ansible.builtin.command: docker --version
      register: docker_present
      changed_when: false
      failed_when: false

    - name: Install docker.io when Docker is absent
      ansible.builtin.apt:
        name: docker.io
        state: present
      when: docker_present.rc != 0

    - name: Docker service enabled and running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Cloudflare package signing key
      ansible.builtin.get_url:
        url: https://pkg.cloudflare.com/cloudflare-main.gpg
        dest: /usr/share/keyrings/cloudflare-main.gpg
        mode: "0644"
      when: cloudflared_enabled | bool

    - name: Cloudflared apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared {{ ansible_distribution_release }} main"
        filename: cloudflared
        state: present
      when: cloudflared_enabled | bool

    - name: Install cloudflared
      ansible.builtin.apt:
        name: cloudflared
        state: present
        # Same rule as the base packages: no cache refresh for a package the
        # host already has.
        update_cache: "{{ 'cloudflared' not in ansible_facts.packages }}"
      when: cloudflared_enabled | bool

    - name: Register cloudflared as a systemd service (remote-managed tunnel)
      ansible.builtin.command:
        cmd: cloudflared service install {{ lookup('file', secrets_src + '/tunnel_token') | trim }}
        creates: /etc/systemd/system/cloudflared.service
      no_log: true
      when: cloudflared_enabled | bool

    - name: Cloudflared service running
      ansible.builtin.systemd:
        name: cloudflared
        state: started
        enabled: true
      when: cloudflared_enabled | bool

- name: Sandbox container — image, secrets, seed content
  hosts: quickreview
  become: true
  tasks:
    - name: Directory layout (container user = uid {{ container_uid }})
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
        owner: "{{ item.owner | default(container_uid) }}"
        group: "{{ item.owner | default(container_uid) }}"
      loop:
        - { path: "{{ sandbox_root }}", mode: "0755", owner: "root" }
        - { path: "{{ sandbox_root }}/build", mode: "0755", owner: "root" }
        - { path: "{{ sandbox_root }}/sandbox", mode: "0755" }
        - { path: "{{ sandbox_root }}/sandbox/agents", mode: "0755" }
        - { path: "{{ sandbox_root }}/sandbox/prompts", mode: "0755" }
        - { path: "{{ sandbox_root }}/state", mode: "0755" }
        # OpenViking's home: ~/.openviking is symlinked here at boot,
        # so memories + vector db + ov.conf survive an image rebuild. 0700 —
        # ov.conf carries the server's root key (and, under the hosted
        # embeddings opt-in, that credential too).
        - { path: "{{ openviking_home }}", mode: "0700" }
        - { path: "{{ sandbox_root }}/pihome", mode: "0700" }
        - { path: "{{ sandbox_root }}/secrets", mode: "0700" }
        # The install's config home as shipped — config.toml +
        # profiles/, mounted read-only; the ship task below also creates it.
        - { path: "{{ sandbox_root }}/config-home", mode: "0755" }

    - name: Secrets into place (readable only by the container user)
      ansible.builtin.copy:
        src: "{{ secrets_src }}/{{ item }}"
        dest: "{{ sandbox_root }}/secrets/{{ item }}"
        mode: "0400"
        owner: "{{ container_uid }}"
        group: "{{ container_uid }}"
      loop: [app_id, app.pem, webhook_secret]
      no_log: true

    # Optional — the deployment uses the ChatGPT-OAuth route: pi auths via
    # `/login` inside the container; the key file ships only if present.
    - name: OpenAI API key (optional under the OAuth route)
      ansible.builtin.copy:
        src: "{{ secrets_src }}/openai_api_key"
        dest: "{{ sandbox_root }}/secrets/openai_api_key"
        mode: "0400"
        owner: "{{ container_uid }}"
        group: "{{ container_uid }}"
      no_log: true
      when: lookup('ansible.builtin.fileglob', secrets_src + '/openai_api_key') | length > 0

    # The HOSTED embeddings credential — a separate file from pi's
    # key, present only when the operator opted into a hosted embedder
    # (openviking_embedding_provider != local). Copied-if-present; absent by
    # default, because the shipped embedder is local and needs no key.
    - name: Hosted embeddings key (optional — only under the hosted-embedder opt-in)
      ansible.builtin.copy:
        src: "{{ secrets_src }}/{{ openviking_embedding_key_file }}"
        dest: "{{ sandbox_root }}/secrets/{{ openviking_embedding_key_file }}"
        mode: "0400"
        owner: "{{ container_uid }}"
        group: "{{ container_uid }}"
      no_log: true
      when: lookup('ansible.builtin.fileglob', secrets_src + '/' + openviking_embedding_key_file) | length > 0

    # The OpenViking auth keys. Copied-if-present, matching the
    # openai_api_key idiom — a missing root key degrades the boot LOUDLY to
    # auth_mode=dev (the entrypoint warns), it never blocks the deploy. The
    # companion key must NEVER be in this list (rule 8: it never touches the VM).
    - name: OpenViking auth keys (root + reviewer; confinement is dev-mode without them)
      ansible.builtin.copy:
        src: "{{ secrets_src }}/{{ item }}"
        dest: "{{ sandbox_root }}/secrets/{{ item }}"
        mode: "0400"
        owner: "{{ container_uid }}"
        group: "{{ container_uid }}"
      loop: ["{{ openviking_root_key_file }}", "{{ openviking_reviewer_key_file }}"]
      no_log: true
      when: lookup('ansible.builtin.fileglob', secrets_src + '/' + item) | length > 0

    # The Slack concierge's tokens, under the default [slack] token file
    # names. Copied-if-present: Slack is
    # optional and off by default, but with `[slack] enabled = true` a missing
    # token is a hard startup error (validateSlackConfig), so whatever the
    # Slack wizard saved in the secrets dir must reach the container.
    - name: Slack tokens (optional — present once the Slack wizard has run)
      ansible.builtin.copy:
        src: "{{ secrets_src }}/{{ item }}"
        dest: "{{ sandbox_root }}/secrets/{{ item }}"
        mode: "0400"
        owner: "{{ container_uid }}"
        group: "{{ container_uid }}"
      loop: [slack_bot_token, slack_app_token]
      no_log: true
      when: lookup('ansible.builtin.fileglob', secrets_src + '/' + item) | length > 0

    # The seed content (prompts/, agents/) has no copy task of its own: it rides
    # the rsync below, byte-identical to the canonical seed set (enforced by
    # tests/seed-integrity.test.ts — root CLAUDE.md rule 6).

    # Stale-image guard. The entrypoint and Dockerfile are BAKED into the
    # image, so a sync — which never rebuilds it — would boot new code on the
    # old entrypoint (e.g. a daemon expecting a secrets path the old entrypoint
    # never links, crash-looping on a missing webhook_secret). Every build
    # stamps the image with a fingerprint of its rendered build
    # context; a sync whose context differs (or an image with no stamp — an
    # unknown is never read as a match) stops HERE, before the rsync and the
    # restart, so the old container keeps running the old code. A missing
    # image (first install) is left to the build below.
    - name: Build context fingerprint
      ansible.builtin.set_fact:
        build_context_sha: "{{ (lookup('ansible.builtin.template', 'Dockerfile.j2') ~ lookup('ansible.builtin.template', 'entrypoint.sh.j2')) | hash('sha256') }}"

    - name: The image the container runs
      community.docker.docker_image_info:
        name: "{{ image_name }}:{{ image_tag }}"
      register: image_on_vm

    - name: "Fail: the image predates this build context — it needs a rebuild, not a sync"
      ansible.builtin.fail:
        msg: >-
          The image {{ image_name }}:{{ image_tag }} was built from a different
          Dockerfile/entrypoint than this checkout renders (image stamp
          {{ (image_on_vm.images[0].Config.Labels | default({}, true)).get('qcr.build-context') | default('none', true) }},
          checkout {{ build_context_sha }}). A sync would boot this code on the
          old entrypoint. Nothing was changed on the VM: run
          `./scripts/deploy.sh rebuild` instead.
      when:
        - not (rebuild_image | default(false) | bool)
        - image_on_vm.images | length > 0
        - (image_on_vm.images[0].Config.Labels | default({}, true)).get('qcr.build-context') != build_context_sha

    - name: Sync the local sandbox working copy (daemon, extensions) when present
      ansible.posix.synchronize:
        src: "{{ sandbox_src }}/"
        dest: "{{ sandbox_root }}/sandbox/"
        # --delete keeps the VM tree a true mirror (renamed/removed files
        # actually disappear); every runtime dir the daemon/pi writes under the
        # sandbox root is excluded, which also protects it from the delete.
        # The runtime excludes are ANCHORED with a leading slash so they match
        # ONLY at the sandbox root. An unanchored rsync pattern matches any
        # path COMPONENT of that name — `memory` would also exclude the
        # daemon's own `src/memory/` and `dist/src/memory/`.
        # .git/.claude/node_modules stay unanchored: those may nest.
        # The base clone's name is the configured one: deploy.sh
        # derives it from config.toml and passes `-e base_clone_dir=…`. No
        # default on purpose — a run that does not name the clone fails here
        # rather than letting --delete wipe a clone it did not know about.
        rsync_opts:
          - "--delete"
          - "--exclude=.git"
          - "--exclude=.claude"
          - "--exclude=node_modules"
          - "--exclude=/state"
          - "--exclude=/wt"
          - "--exclude=/archive"
          - "--exclude=/commands"
          - "--exclude=/digest"
          - "--exclude=/inject"
          - "--exclude=/verdict"
          - "--exclude=/memory"
          - "--exclude=/notes"
          - "--exclude=/ledger.md"
          - "--exclude=/AGENTS.override.md"
          - "--exclude=/{{ base_clone_dir | mandatory }}"
          - "--exclude=/pihome"
      when: sandbox_src is defined

    # The install's config home — the live config.toml and the
    # profiles/ beside it — shipped by the secrets' route: its own task from a
    # controller-side dir deploy.sh names (`-e config_home_src=…`, the install
    # locator's answer, and `-e config_file_name=…`), onto a VM dir the
    # container mounts read-only. Never the checkout rsync: the config and the
    # install's profiles do not live in the checkout. It runs in `sync`
    # (it follows the start-at task) so a profile change reaches the VM
    # without a rebuild.
    # Exactly two things ship — the filter admits the config file and
    # profiles/**, and excludes the rest of the home, above all its secrets/
    # (those ride the secrets tasks, 0400, rebuild only). --delete plus
    # --delete-excluded keep the VM copy an exact mirror: a profile or addendum
    # removed locally disappears there too. --copy-links ships a symlinked
    # profile as the files it points at. No defaults on purpose — a run that
    # does not name the home fails here rather than booting on a stale one.
    - name: Ship the install's config home (config.toml + profiles/, never secrets/)
      ansible.posix.synchronize:
        src: "{{ config_home_src | mandatory }}/"
        dest: "{{ sandbox_root }}/config-home/"
        rsync_opts:
          - "--delete"
          - "--delete-excluded"
          - "--copy-links"
          - "--include=/{{ config_file_name | mandatory }}"
          - "--include=/profiles/***"
          - "--exclude=*"

    # rsync lands files with controller-side ownership; the container user
    # (uid 1001) must own the tree to npm-ci/build on boot.
    - name: Sandbox tree owned by the container user
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ container_uid }}"
        group: "{{ container_uid }}"
        recurse: true
      loop:
        - "{{ sandbox_root }}/sandbox"
        - "{{ sandbox_root }}/state"
        - "{{ sandbox_root }}/config-home"

    # …except the operator command channel: `commands/operator/` is
    # root-owned 0755 so no session (uid {{ container_uid }}) can write there,
    # and that seal is the ONLY thing telling an operator's drain from a
    # session's. The recurse above hands it to the container user on every
    # deploy, and an unsealed channel serves the next operator command as a
    # session's (bounded, and not lifted by the boot). Re-seal it; never
    # create it here — a
    # root-owned commands/ parent would lock the daemon out of its own dir.
    - name: Operator command channel present?
      ansible.builtin.stat:
        path: "{{ sandbox_root }}/sandbox/commands/operator"
      register: operator_channel

    - name: Operator command channel stays root-owned 0755 (the seal)
      ansible.builtin.file:
        path: "{{ sandbox_root }}/sandbox/commands/operator"
        state: directory
        owner: "0"
        group: "0"
        mode: "0755"
      when: operator_channel.stat.exists and operator_channel.stat.isdir and not operator_channel.stat.islnk

    - name: Build context — Dockerfile and entrypoint
      ansible.builtin.template:
        src: "templates/{{ item.src }}"
        dest: "{{ sandbox_root }}/build/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: Dockerfile.j2, dest: Dockerfile, mode: "0644" }
        - { src: entrypoint.sh.j2, dest: entrypoint.sh, mode: "0755" }

    - name: Build the sandbox image
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        force_source: "{{ rebuild_image | default(false) | bool }}"
        build:
          path: "{{ sandbox_root }}/build"
          # Read back by the stale-image guard before every sync.
          labels:
            qcr.build-context: "{{ build_context_sha }}"

    - name: Run the sandbox container
      community.docker.docker_container:
        name: "{{ image_name }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        # `state: started` alone is idempotent — a running container is left
        # untouched, so a code sync would ship bytes nobody executes. sync
        # passes force_restart=true: restart re-runs the entrypoint (dist
        # rebuild, fresh .tmux.conf/tmux server, daemon on the new build).
        restart: "{{ force_restart | default(false) | bool }}"
        restart_policy: unless-stopped
        # PID-1 discipline: with a supervised OpenViking process
        # beside the daemon, PID 1 must reap. tini forwards signals and adopts
        # orphans; node as PID 1 reaps only its own direct children, so any
        # grandchild the server leaves behind would accumulate as a zombie.
        init: true
        # Hard caps — the VM is shared; the VM itself is never resized.
        cpus: "{{ container_cpus | float }}"
        memory: "{{ container_memory }}"
        memory_swap: "{{ container_memory }}"   # no swap ballooning past the cap
        # The webhook port is the ONLY thing this container exposes.
        # OpenViking's {{ openviking_port }} is deliberately absent: it is
        # loopback-INSIDE-the-container, reachable by the daemon and the pi
        # sessions and by nothing else. Do not publish it.
        published_ports:
          - "127.0.0.1:{{ webhook_port }}:{{ webhook_port }}"
        volumes:
          - "{{ sandbox_root }}/sandbox:/opt/quickreview/sandbox"
          - "{{ sandbox_root }}/state:/opt/quickreview/state"
          - "{{ sandbox_root }}/secrets:/opt/quickreview/secrets:ro"
          # The shipped config home, read-only like the secrets —
          # the same mount point the compose route uses.
          - "{{ sandbox_root }}/config-home:/opt/quickreview/config-home:ro"
          # pi's home: OAuth tokens (auth.json), session JSONLs, models.json —
          # must survive container rebuilds (sticky sessions + /login tokens)
          - "{{ sandbox_root }}/pihome:/home/review/.pi"
        env:
          TZ: "{{ timezone }}"
          QC_REVIEW_PORT: "{{ webhook_port | string }}"
          # In-container bind must be 0.0.0.0 — the published port targets the
          # container's eth0; host exposure stays 127.0.0.1-only above.
          QC_BIND_HOST: "0.0.0.0"
          # The live config is the shipped one. The in-container
          # install locator finds the install's profiles beside it, then the
          # rsynced checkout's generic examples; the daemon hands this path
          # to every session. Set on the container (not in the image) so a
          # plain `sync` delivers it.
          QCR_CONFIG: "/opt/quickreview/config-home/{{ config_file_name | mandatory }}"

    # The subagent fan-out cap needs no post-start task: it rides config.toml
    # [pi] subagent_max_concurrency, delivered per session as
    # QCR_SUBAGENT_MAX_CONCURRENCY and enforced by extensions/subagents.ts.

    - name: Note — webhook ingress
      ansible.builtin.debug:
        msg: >-
          The webhook port is published on 127.0.0.1:{{ webhook_port }} only.
          {% if cloudflared_enabled | bool %}cloudflared forwards the public
          hostname -> localhost:{{ webhook_port }} -> container.{% else %}
          cloudflared is disabled (cloudflared_enabled=false) — point your own
          HTTPS proxy or tunnel at localhost:{{ webhook_port }}.{% endif %}
