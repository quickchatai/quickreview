---
# Review-sandbox provisioning knobs — vendored working copy (the
# tracker asset is the historical record). Target: the EXISTING shared `VM`
# VM in your-dev-project (e2-standard-4); the container is capped, the VM is not
# ours to resize.

sandbox_root: /opt/quickreview          # on the VM
webhook_port: 8787

image_name: quickreview-sandbox
image_tag: v1

node_major: "22"
# pi CLI npm package + exact version pin (findings; registry-verified
# 2026-08-13). The image never floats — bumping is a deliberate edit +
# `-e rebuild_image=true`.
pi_npm_package: "@earendil-works/pi-coding-agent"
pi_version: "0.84.1"

# pi extensions — same discipline as pi_version: exact pins, never floating,
# bumping is a deliberate edit + `-e rebuild_image=true`.
#
# pi-subagents: the package we depend on is amosblomqvist/pi-subagents
# (§1, package.json `pi.extensions`). It is a RAW extension repo with
# no package.json — it is NOT on npm, and the npm/pi.dev name "pi-subagents"
# belongs to nicobailon's UNRELATED package (verified 2026-08-14: npm
# repository.url = nicobailon/pi-subagents; github.com/amosblomqvist/
# pi-subagents exists separately and does not redirect). So it is pinned by
# exact git commit (main HEAD, committed 2026-05-22, checked 2026-08-14) and
# baked into the image by clone+checkout, not npm install.
pi_subagents_repo: "https://github.com/amosblomqvist/pi-subagents.git"
pi_subagents_commit: "1f541897588b995144f0bb8e71a335d1c85b1e62"

# RETIRED: pi_memory_package/pi_memory_version and
# qmd_npm_package/qmd_version. The hand-rolled memory engine is gone — memory
# is OpenViking (below) and its pi extension is vendored in the repo, not
# installed from npm. Re-adding either pin would put a second memory engine in
# the image; that is the thing this phase deleted.

# OpenViking (github.com/volcengine/OpenViking) — the context store the daemon
# supervises as a second process inside the container, on LOOPBACK 1933
#. Same pin discipline as pi_version: exact versions, never floating,
# bumping is a deliberate edit + `-e rebuild_image=true`.
#
# TRIPLE MIRROR: openviking_version / llama_cpp_python_version here ==
# config.toml [openviking] version / llama_cpp_python_version == the Dockerfile
# venv layer (which interpolates THESE vars, never a literal).
# tests/openviking.test.ts fails on drift.
#
# llama-cpp-python is NOT an openviking dependency — it is an undeclared
# optional extra, and without it the default local dense embedder raises
# EmbeddingConfigurationError at startup, so the server cannot boot at all
# (verified against a running 0.4.15, 2026-08-20). PyPI-verified pins
# (2026-08-20): openviking 0.4.15 (requires-python >=3.10; 24.04 ships 3.12),
# llama-cpp-python 0.3.35.
openviking_version: "0.4.15"
llama_cpp_python_version: "0.3.35"
openviking_venv: /opt/openviking/venv
openviking_port: 1933                 # loopback only — NEVER a published port
# ~/.openviking is symlinked here at boot, so memory lives on the state volume
# and survives an image rebuild. Must equal config.toml [openviking] home.
openviking_home: /opt/quickreview/state/openviking
openviking_workers: 1                 # ov.conf server.workers (2-CPU cap)
openviking_queue_concurrency: 2       # ov.conf queue_workers.* (defaults 4/4/8)
# OpenAI embeddings ENABLED; ov.conf carries NO `vlm` section (extraction,
# summaries and digest are off — memories are authored, never extracted).
openviking_embedding_model: "text-embedding-3-small"
openviking_embedding_dimension: 1536

# tmux ≥3.5 for csi-u extended keys end-to-end (§3E):
# Ubuntu 24.04 apt ships 3.4, so the image builds this release from source.
tmux_version: "3.5a"

timezone: Europe/Warsaw
container_uid: 1001                   # the in-container 'review' user (Dockerfile)

# Hard Docker limits — the VM is shared (the owner, 2026-08-13).
container_cpus: "2"
container_memory: "8g"

# Preflight refusal threshold on the shared box.
min_free_disk_gb: 15

# Controller-side sources
secrets_src: "{{ lookup('env', 'HOME') }}/.config/quickreview-bot"
# Expected files there: app_id, app.pem, openai_api_key, webhook_secret, tunnel_token

# The prompt/agent artifact set (seeded into the container volume).
seed_src: "/path/to/seed-assets"

# The local sandbox working copy (daemon, extensions, prompts).
sandbox_src: "/path/to/quickreview"
