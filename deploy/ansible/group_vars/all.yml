---
# Review-sandbox provisioning knobs. Target: an EXISTING, possibly shared VM
# (e.g. `my-vm`, an e2-standard-4 in your cloud project) — name it in
# inventory.ini (copy inventory.example.ini). The container is capped; the VM
# is assumed not ours to resize.

sandbox_root: /opt/quickreview          # on the VM
webhook_port: 8787

image_name: quickreview-sandbox
image_tag: v1

node_major: "22"
# pi CLI npm package + exact version pin (registry-verified). The image never
# floats — bumping is a deliberate edit + `-e rebuild_image=true`.
pi_npm_package: "@earendil-works/pi-coding-agent"
pi_version: "1.3.0"

# No subagent-extension pin: subagents are pi's own first-party extension,
# shipped INSIDE the pinned pi package (examples/extensions/subagent) and
# loaded from the installed package by extensions/subagents.ts, so there is no
# separate pin to drift. Never add a third-party subagent clone step here (it
# would bring in an unlicensed dependency).

# No memory-engine npm pin: memory is OpenViking (below) and its pi extension
# is vendored in the repo, not installed from npm. An npm memory package here
# would put a second memory engine in the image.

# OpenViking (github.com/volcengine/OpenViking) — the context store the daemon
# supervises as a second process inside the container, on LOOPBACK 1933.
# Same pin discipline as pi_version: exact versions, never floating,
# bumping is a deliberate edit + `-e rebuild_image=true`.
#
# TRIPLE MIRROR: openviking_version / llama_cpp_python_version here ==
# config.toml [openviking] version / llama_cpp_python_version == the Dockerfile
# venv layer (which interpolates THESE vars, never a literal).
# tests/openviking.test.ts fails on drift.
#
# llama-cpp-python is NOT an openviking dependency — it is an undeclared
# optional extra, and without it the default local dense embedder raises
# EmbeddingConfigurationError at startup, so the server cannot boot at all
# (verified against a running 0.4.15). It is also the runtime of the local
# English embedder (below). PyPI-verified pins: openviking 0.4.15
# (requires-python >=3.10; 24.04 ships 3.12), llama-cpp-python 0.3.35.
openviking_version: "0.4.15"
llama_cpp_python_version: "0.3.35"
openviking_venv: /opt/openviking/venv
openviking_port: 1933                 # loopback only — NEVER a published port
# ~/.openviking is symlinked here at boot, so memory lives on the state volume
# and survives an image rebuild. Must equal config.toml [openviking] home.
openviking_home: /opt/quickreview/state/openviking
openviking_workers: 1                 # ov.conf server.workers (2-CPU cap)
openviking_queue_concurrency: 2       # ov.conf queue_workers.* (defaults 4/4/8) + embedding.max_concurrent (10)
# The embedder. LOCAL is the shipped default: a small
# ENGLISH embedding model served on loopback INSIDE the container by
# scripts/openviking-embedder.py (over the pinned llama_cpp_python above), so
# no memory text ever leaves the machine — nothing but the model call does.
# Under "local" the entrypoint renders ov.conf's OpenAI-COMPATIBLE provider
# with api_base http://127.0.0.1:{{ openviking_local_embedder_port }}/v1 and no
# key — the engine's async client, so a search does not block the server.
# A HOSTED embedder is an explicit opt-in, written as INVENTORY HOST VARS on the
# host line (host vars outrank this file, and this file stays tracked and
# clean):
#     openviking_embedding_provider=openai openviking_embedding_model=text-embedding-3-small openviking_embedding_dimension=1536
# plus the credential in <secrets_src>/<openviking_embedding_key_file> — a
# SEPARATE file from pi's openai_api_key, so either can be set without the
# other. The entrypoint renders these into ov.conf `embedding.dense`; ov.conf
# carries NO `vlm` section either way (extraction, summaries and digest are
# off — memories are authored, never extracted).
# MIRRORS config.toml [openviking] embedding_provider / embedding_model /
# embedding_dimension / embedding_key_file; scripts/deploy.sh's preflight
# refuses on drift between config.toml and the EFFECTIVE ansible value (host
# var, else this file) — a config.toml that says "openai" over a boot that
# renders "local" would reset the vector store on the next start.
# Under "local" the model/dimension are the local embedder's (the pin below);
# the render uses the pin's own values and warns if these disagree.
openviking_embedding_provider: "local"
openviking_embedding_model: "bge-small-en-v1.5-f16"
openviking_embedding_dimension: 384
openviking_embedding_key_file: "openai_embeddings_api_key"
# The LOCAL EMBEDDER's model file — a rule-7 pin like
# openviking_version. TRIPLE MIRROR: these == config.toml [openviking]
# local_embedder_file (== dir/model.gguf) / local_embedder_url /
# local_embedder_sha256 == the Dockerfile model layer, which downloads the
# GGUF at BUILD time and refuses it unless the sha256 matches (the service
# re-checks it at every start). The image carries it whatever the provider, so
# a hosted opt-in can return to local without a rebuild; changing the pin needs
# `scripts/deploy.sh rebuild`. tests/openviking.test.ts and the deploy
# preflight refuse on drift. The dimension is the model's own (the service's
# model table in scripts/openviking-embedder.py), mirrored here for the render.
openviking_local_embedder_model: "bge-small-en-v1.5-f16"
openviking_local_embedder_dimension: 384
openviking_local_embedder_dir: /opt/openviking/models
openviking_local_embedder_url: "https://huggingface.co/CompendiumLabs/bge-small-en-v1.5-gguf/resolve/d32f8c040ea3b516330eeb75b72bcc2d3a780ab7/bge-small-en-v1.5-f16.gguf"
openviking_local_embedder_sha256: "f0b2fef971e8366438bfd2d9aefea1b0115919389448806d290237f638bae999"
# The service: 127.0.0.1 only — NEVER a published port. One llama.cpp thread
# is the latency budget the model was chosen on. MIRRORS config.toml
# [openviking] local_embedder_port / local_embedder_threads (the daemon
# supervises the long-lived service from those; the boot's provisioning step
# runs it briefly from these).
openviking_local_embedder_port: 1934
openviking_local_embedder_threads: 1
# Server-side confinement. `api_key` makes every request carry a USER key the
# server confines to that user's tree; `dev` bypasses authentication and makes
# the two-user design nominal, so it is never the deployed value. MIRRORS
# config.toml [openviking] auth_mode / root_key_file / reviewer_key_file / provision_users;
# tests/openviking.test.ts and the scripts/deploy.sh preflight refuse on drift.
openviking_auth_mode: "api_key"
# Secret FILE NAMES under the container's read-only secrets mount. The ROOT key
# is the SERVER's own credential — ov.conf carries it (0600) and boot
# provisioning uses it; no daemon surface, no review session and no companion
# process ever holds it. The REVIEWER key is the one client credential the
# container may hold. The COMPANION key is deliberately ABSENT from this
# machine: a review session that could read it would reach companion memory,
# which is the whole thing confinement exists to prevent.
openviking_root_key_file: "openviking_root_key"
openviking_reviewer_key_file: "openviking_reviewer_key"
# Users boot provisioning ENSURES exist — created if absent, left alone if
# present, never rotated (a rotation orphans the distributed keys).
openviking_provision_users: "reviewer,companion"

# tmux ≥3.5 for csi-u extended keys end-to-end:
# Ubuntu 24.04 apt ships 3.4, so the image builds this release from source.
tmux_version: "3.5a"

timezone: Europe/Warsaw
container_uid: 1001                   # the in-container 'review' user (Dockerfile)

# Hard Docker limits — the VM may be shared with other workloads.
container_cpus: "2"
container_memory: "8g"

# Preflight refusal threshold on the shared box.
min_free_disk_gb: 15

# Ingress. The tunnel is OPTIONAL: any HTTPS proxy or tunnel that
# forwards your webhook hostname to localhost:{{ webhook_port }} on the VM
# works. `true` keeps the live deployment's cloudflared service (and then
# `tunnel_token` must exist under secrets_src); set false (or
# `-e cloudflared_enabled=false`) to bring your own ingress — no other task
# depends on the tunnel.
cloudflared_enabled: true

# Controller-side sources
# scripts/deploy.sh rebuild passes `-e secrets_src=<dir>` — the install
# locator's answer: [github] secrets_dir, else the install's config home
# (~/.config/qcr/<install>/secrets). This default — the default
# install's home — only serves a playbook run by hand.
secrets_src: "{{ lookup('env', 'HOME') }}/.config/qcr/default/secrets"
# Expected files there: app_id, app.pem, webhook_secret; openai_api_key
# optional (pi's API-key route); tunnel_token only when cloudflared_enabled;
# openai_embeddings_api_key only under the hosted-embedder opt-in above.

# The local sandbox working copy (daemon, extensions, prompts, the seed
# content — prompts/ and agents/ ride this rsync; there is no separate seed
# source). Defaults to the repo this playbook lives in;
# override with -e for a different checkout.
sandbox_src: "{{ playbook_dir | dirname | dirname }}"

# Flat Slack token names copied from the controller secrets directory.
slack_bot_token_file: slack_bot_token
slack_app_token_file: slack_app_token
