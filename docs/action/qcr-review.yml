# QuickReview: an AI code review of a pull request, posted as one comment-only review.
# Comment /qcr on a pull request to ask for a review.
# Run the workflow by hand from the Actions tab (QuickReview, Run workflow) with a pull request number.
# Every run is a full review on your model key; a re-run pays again.
# Docs: https://github.com/quickchatai/quickreview/blob/main/docs/action.md
name: QuickReview

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: The number of the pull request to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: quickreview-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: true
    if: >-
      (github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/qcr'))
      || (github.event_name == 'workflow_dispatch')
    steps:
      - uses: quickchatai/quickreview@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          pr: ${{ inputs.pr }}
          # profile: security         # a shipped profile instead of the standard review
          # model: provider/model     # default: the provider's newest
          # limit: "5"                # a hard stop in US dollars; none by default
